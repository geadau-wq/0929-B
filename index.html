<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-2-13 鐘面的時刻動態探究工具</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX processing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
      // 狀態變數設定
      const [t, setT] = useState(0); // 動態撥動進度 0 ~ 10
      const [a, setA] = useState(1); // 參數 a: 教學模式 (1: 幾時幾分/五個一數, 2: 兩整時之間的點數)
      const [k, setK] = useState(3); // 參數 k: 起始整點 (1 ~ 12時)
      const [h, setH] = useState(4); // 參數 h: 變動量 (Mode 1: 單位5分鐘, Mode 2: 經過小時)
      const [isPlaying, setIsPlaying] = useState(false);
      const animationRef = useRef(null);

      const maxT = 10;

      // 動態動畫控制 (撥動指針進程)
      useEffect(() => {
        if (isPlaying) {
          let lastTime = performance.now();
          const animate = (currentTime) => {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            setT((prevT) => {
              const nextT = prevT + (deltaTime / 1000) * 2.5; // 每秒前進 2.5 單位
              if (nextT >= maxT) {
                setIsPlaying(false);
                return maxT;
              }
              return nextT;
            });
            animationRef.current = requestAnimationFrame(animate);
          };
          animationRef.current = requestAnimationFrame(animate);
        } else {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
        }
        return () => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
        };
      }, [isPlaying]);

      // 控制按鈕處理函數
      const handlePlayPause = () => {
        if (t >= maxT) setT(0);
        setIsPlaying(!isPlaying);
      };

      const handleReset = () => {
        setIsPlaying(false);
        setT(0);
      };

      // --- 主圖形 SVG 鐘面坐標轉換 ---
      const svgWidth = 600;
      const svgHeight = 600;
      const originX = 300; // 置中
      const originY = 300; // 置中

      // 計算當前時刻數值
      let currentMinuteValue = 0;
      let currentHourValue = k;
      let currentHourOffset = 0;

      if (a === 1) {
        // 模式 1: 幾時幾分
        const targetMinute = h * 5;
        currentMinuteValue = (t / 10) * targetMinute;
        currentHourValue = k + (currentMinuteValue / 60);
      } else {
        // 模式 2: 整點點數
        currentHourOffset = (t / 10) * h;
        currentHourValue = k + currentHourOffset;
        currentMinuteValue = 0;
      }

      // 取得日常語言溝通意義 (時鐘讀法)
      const getColloquialText = () => {
        if (a === 1) {
          const displayMin = Math.round(currentMinuteValue);
          const displayHour = Math.floor(currentHourValue) % 12 || 12;
          return `${displayHour} 點 ${displayMin === 0 ? "鐘" : `${displayMin} 分`}`;
        } else {
          const startHr = k % 12 || 12;
          const endHr = Math.floor(k + currentHourOffset) % 12 || 12;
          return `從 ${startHr} 點到 ${endHr} 點，經過了 ${Math.floor(currentHourOffset)} 小時`;
        }
      };

      // 決定當前撥動活動的狀態文字與顏色
      const getStatus = () => {
        if (t === 0) return { text: "準備進行鐘面撥動操作", color: "text-gray-600", icon: "○" };
        if (t < maxT) return { text: a === 1 ? "正在撥動分針，觀察五個一數..." : "正在點數整點，觀察時針跳動...", color: "text-blue-500", icon: "➔" };
        return { text: "操作完成！觀察最終指針位置", color: "text-red-500", icon: "●" };
      };

      const currentStatus = getStatus();

      return (
        <div className="min-h-screen bg-gray-100 p-4 font-sans text-gray-800">
          <div className="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
            
            {/* Header - 課綱指標核心區域 */}
            <div className="bg-emerald-600 text-white p-6">
              <div className="flex justify-between items-start flex-wrap gap-2">
                <div>
                  <h1 className="text-2xl font-bold mb-2">N-2-13 鐘面的時刻動態探究工具</h1>
                  <p className="text-emerald-100 text-lg">
                    以操作活動為主。以鐘面時針與分針之位置認識「幾時幾分」。<br/>
                    含兩整時時刻之間的整時點數（時間加減的前置經驗）。
                  </p>
                </div>
                <span className="bg-emerald-800 text-white text-xl font-bold px-4 py-2 rounded-lg shadow-md border border-emerald-500 font-mono">
                  n-I-9
                </span>
              </div>
            </div>

            <div className="p-6 flex flex-col gap-6">
              
              {/* 上方：控制面板 */}
              <div className="bg-white rounded-lg border-2 border-gray-200 p-5 shadow-sm w-full">
                <div className="flex items-center justify-between mb-4 border-b pb-2">
                  <h3 className="text-lg font-bold">互動控制與參數設定</h3>
                  <div className="flex gap-2">
                    <button 
                      onClick={handlePlayPause}
                      className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-semibold text-sm transition-colors"
                    >
                      {isPlaying ? (
                        <><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> 暫停</>
                      ) : (
                        <><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> {t >= maxT ? '重新演示' : '自動演示'}</>
                      )}
                    </button>
                    <button 
                      onClick={handleReset}
                      className="flex items-center gap-2 bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg font-semibold text-sm transition-colors"
                    >
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> 重置
                    </button>
                  </div>
                </div>

                {/* 三個參數調整拉桿 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4 border-b pb-4 bg-gray-50 p-4 rounded-lg">
                  <div>
                    <div className="flex justify-between text-sm text-gray-700 font-semibold mb-1">
                      <span>教學模式: {a === 1 ? "幾時幾分 (五個一數)" : "兩整點數 (經過時間)"}</span>
                    </div>
                    <input type="range" min="1" max="2" step="1" value={a} onChange={(e) => { setA(parseInt(e.target.value)); setIsPlaying(false); }} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                  </div>
                  <div>
                    <div className="flex justify-between text-sm text-gray-700 font-semibold mb-1">
                      <span>起始時刻: {k} 點鐘</span>
                    </div>
                    <input type="range" min="1" max="12" step="1" value={k} onChange={(e) => { setK(parseInt(e.target.value)); setIsPlaying(false); }} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                  </div>
                  <div>
                    <div className="flex justify-between text-sm text-gray-700 font-semibold mb-1">
                      <span>{a === 1 ? `目標分鐘: ${h * 5} 分` : `目標經過: ${h} 小時`}</span>
                    </div>
                    <input type="range" min="1" max="11" step="1" value={h} onChange={(e) => { setH(parseInt(e.target.value)); setIsPlaying(false); }} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                  </div>
                </div>

                {/* 撥動動態進度拉桿 */}
                <div className="px-2">
                  <div className="flex justify-between text-sm font-medium text-gray-600 mb-2">
                    <span>操作起點</span>
                    <span>撥動進程: <span className="text-emerald-600 text-lg font-bold">{(t * 10).toFixed(0)}%</span></span>
                    <span>目標時刻</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="10"
                    step="0.05"
                    value={t}
                    onChange={(e) => {
                      setT(parseFloat(e.target.value));
                      setIsPlaying(false);
                    }}
                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-emerald-600"
                  />
                </div>
              </div>

              {}
              <div className="flex flex-col lg:flex-row gap-6">
                
                {/* 左側：主鐘面與指針動態 */}
                <div className="w-full lg:w-2/3 flex flex-col">
                  <h2 className="text-xl font-bold mb-4 border-b-2 border-emerald-500 pb-2">操作鐘面展示</h2>
                  <div className="relative w-full aspect-square bg-[#f8fafc] rounded-lg border-2 border-gray-200 overflow-hidden shadow-inner flex items-center justify-center">
                    <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-full max-w-[500px]">
                      
                      {/* 鐘面外框與底色 */}
                      <circle cx={originX} cy={originY} r={210} fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="8" />
                      <circle cx={originX} cy={originY} r={195} fill="#ffffff" stroke="#94a3b8" strokeWidth="2" />

                      {/* 分鐘與小時刻度 */}
                      {Array.from({ length: 60 }).map((_, i) => {
                        const isHour = i % 5 === 0;
                        return (
                          <line
                            key={`tick-${i}`}
                            x1={originX} y1={originY - 195}
                            x2={originX} y2={originY - (isHour ? 175 : 185)}
                            stroke={isHour ? "#334155" : "#94a3b8"} 
                            strokeWidth={isHour ? 4 : 2}
                            transform={`rotate(${i * 6} ${originX} ${originY})`}
                          />
                        )
                      })}

                      {/* 鐘面數字 (1-12) */}
                      {Array.from({ length: 12 }).map((_, i) => {
                        const hour = i + 1;
                        const angle = (hour * 30 - 90) * Math.PI / 180;
                        const x = originX + 145 * Math.cos(angle);
                        const y = originY + 145 * Math.sin(angle) + 12; // 垂直微調
                        return <text key={`num-${hour}`} x={x} y={y} fontSize="34" fontWeight="900" textAnchor="middle" fill="#1e293b">{hour}</text>
                      })}

                      {/* 模式1：五個一數/十個一數 輔助標示 (外圈) */}
                      {a === 1 && Array.from({ length: 12 }).map((_, i) => {
                        const minVal = (i + 1) * 5;
                        // 只顯示當前進度已達到的分鐘數，加上微小容差避免閃爍
                        if (minVal > currentMinuteValue + 0.1) return null; 
                        const isTen = minVal % 10 === 0; // 區分五個一數與十個一數
                        const angle = (minVal * 6 - 90) * Math.PI / 180;
                        const x = originX + 245 * Math.cos(angle);
                        const y = originY + 245 * Math.sin(angle) + 8;
                        return (
                          <g key={`min-text-${minVal}`}>
                            <circle cx={x} cy={y-6} r={16} fill={isTen ? "#fef08a" : "#e0f2fe"} />
                            <text x={x} y={y} fontSize="18" fontWeight="bold" fill={isTen ? "#ca8a04" : "#0284c7"} textAnchor="middle">
                              {minVal}
                            </text>
                          </g>
                        );
                      })}

                      {/* 模式2：整時點數 輔助標示 (跳動箭頭概念) */}
                      {a === 2 && Array.from({ length: Math.floor(currentHourOffset) }).map((_, i) => {
                        const hr = k + i + 0.5; // 在兩個小時中間顯示 +1
                        const angle = (hr * 30 - 90) * Math.PI / 180;
                        const x = originX + 240 * Math.cos(angle);
                        const y = originY + 240 * Math.sin(angle) + 6;
                        return (
                          <text key={`jump-${i}`} x={x} y={y} fontSize="20" fontWeight="bold" fill="#ef4444" textAnchor="middle">
                            +1
                          </text>
                        );
                      })}

                      {/* 鐘面時針 (粗短) */}
                      <line
                        x1={originX} y1={originY}
                        x2={originX} y2={originY - 100}
                        stroke="#1e3a8a" strokeWidth="10" strokeLinecap="round"
                        transform={`rotate(${currentHourValue * 30} ${originX} ${originY})`}
                      />
                      
                      {/* 鐘面分針 (細長) */}
                      <line
                        x1={originX} y1={originY}
                        x2={originX} y2={originY - 165}
                        stroke="#ef4444" strokeWidth="6" strokeLinecap="round"
                        transform={`rotate(${currentMinuteValue * 6} ${originX} ${originY})`}
                      />

                      {/* 鐘面中心點 */}
                      <circle cx={originX} cy={originY} r="10" fill="#0f172a" />
                      <circle cx={originX} cy={originY} r="4" fill="#ffffff" />

                    </svg>
                  </div>
                  
                  {/* 課綱提醒字樣 */}
                  <p className="text-sm text-gray-500 mt-2 text-center font-medium">
                    藍色粗針為「時針」，紅色細針為「分針」。根據備註，本活動<span className="text-amber-600 font-bold">不含秒針教學</span>。
                  </p>
                </div>

                {}
                {/* 右側：即時數據與課綱概念對應 */}
                <div className="w-full lg:w-1/3 flex flex-col gap-4 pt-0 lg:pt-12">
                  
                  {/* 日常語言與時鐘讀法 */}
                  <div className="bg-emerald-50 rounded-lg p-5 border border-emerald-100">
                    <div className="text-sm text-emerald-700 font-semibold mb-2">時鐘時刻與點數意義</div>
                    <div className="text-2xl lg:text-3xl font-bold text-gray-800 break-all mb-3 text-emerald-900">
                      {getColloquialText()}
                    </div>
                    <div className="text-sm text-emerald-600 border-t border-emerald-200 pt-2">
                      對應指標：{a === 1 ? "認識「幾時幾分」" : "兩整時之間的整時點數"}
                    </div>
                  </div>

                  {/* 狀態監控 */}
                  <div className="bg-orange-50 rounded-lg p-5 border border-orange-100">
                    <div className="text-sm text-orange-600 font-semibold mb-2">時針與分針的關係狀態</div>
                    <div className="text-xl font-bold text-gray-800 flex items-center gap-3">
                      <span className={currentStatus.color}>{currentStatus.text}</span>
                      <span className={`text-2xl ${currentStatus.color}`}>{currentStatus.icon}</span>
                    </div>
                    <div className="mt-2 text-xs font-semibold text-gray-500">
                      觀察分針走動時，時針也會跟著按比例緩慢移動。
                    </div>
                  </div>

                  {/* 課綱嚴謹性提示卡片 */}
                  <div className="bg-gray-50 rounded-lg p-4 border border-gray-200 text-xs text-gray-600 space-y-1">
                    <div className="font-bold text-gray-700 mb-1">💡 教學與備註核心：</div>
                    <div>• 同時加強外圈的<span className="text-blue-600 font-bold">「五個一數」</span>與<span className="text-yellow-600 font-bold">「十個一數」</span>。</div>
                    <div>• 本階段活動以操作為主，<span className="text-red-600 font-bold">不含秒針</span>教學。</div>
                    <div>• 「兩整時時刻點數」作為後續時間加減的前置經驗，須配合鐘面實際撥動進行。</div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
